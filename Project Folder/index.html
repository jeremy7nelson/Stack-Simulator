<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="./dependencies/style.css">
        <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
        <script type="module" src="./dependencies/main.js"></script>
        <script type="module" src="./dependencies/kinetics.js"></script>
        <script type="module" src="./dependencies/noise.js"></script>
        <script type="module" src="./dependencies/render.js"></script>
        <script type="module" src="./dependencies/download.js"></script>
        <script type="module" src="./dependencies/exporting.js"></script>
        <script type="module" src="./dependencies/plotting.js"></script>
    </head>
    <body>
      <div class="container">
        <main class="controls">
          <div class="group">
            <p class="group-title">Import Model Information</p>
          </div>
          <div class="group">
            <p class="group-title">Model generation</p>
            <div class="field">
              <label>Confluency <span class="unit"> Percentage (%)</span></label>
              <input type="number" id="Confluency" value="30" step="1" max="100" min="0">
              <h1></h1>
              <label>Placement Seed</label>
              <input type="number" class="seed" id="inputSeed" value="0">
              <button class="pri" id="genSeed">Generate Random Seed</button>
              <label>Capacity Bins <span class="unit">fraction of Rmax, 0–1, comma/space separated</span></label>
              <input type="text" id="capacityBin" value="0.4, 0.6, 0.8, 1">
            </div>
            <div class="check">
              <input type="checkbox" id="overlap">
              <label>Allow Overlap</label>
            </div>
            <div class="check">
              <input type="checkbox" id="dominance">
              <label>Allow Edge-Dominance</label>
            </div>
          </div>

          <div class="group">
            <p class="group-title">Noise</p>
            <div class="section">
              <div class="field">
                <label class="check">
                  <input type="checkbox" id="noiseOn"> Add Per Pixel Noise
                </label>
                <label class="check">
                  <input type="checkbox" id="driftOn"> Add Drift
                  <div class="grid2" id="driftField" style="opacity:.45; pointer-events:none">
                    <div class="field">
                      <label>Drift at Cell Edges <span class="unit">0–0.3</span></label>
                      <input type="number" id="driftEdge" value="0.15" max="0.3" min="0" step="0.1">
                    </div>
                    <div class="field">
                      <label>Instrument Drift</label>
                      <input type="number" id="Dmultiplier" value="3.5" min="0" step="0.5">
                    </div>
                    <div class="field">
                      <label>tau</label>
                      <input type="number" id="tau" value="500" min="0">
                    </div>
                    <div class="field">
                      
                    </div>
                  </div>
                </label>
                <label class="check">
                  <input type="checkbox" id="NSAOn"> Add Non-specific Binding
                  <div class="grid2" id="nsaField" style="opacity:.45; pointer-events:none">
                    <div class="field">
                      <label>Background Floor <span class="unit">× specific-binding peak</span></label>
                      <input type="number" id="nsaBackground" value="0.65" min="0" step="0.1">
                    </div>
                    <div class="field">
                      <label>Added at Edges <span class="unit">× specific-binding peak</span></label>
                      <input type="number" id="nsaEdge" value="0.65" min="0" step="0.1">
                    </div>
                    <div class="field">
                      <label>Buildup Rate</label>
                      <input type="number" id="nsaBuildup" value="4e3" min="0" step="any">
                    </div>
                    <div class="field">
                      <label>Fade Rate</label>
                      <input type="number" id="nsaFade" value="1e-4" min="0" step="any">
                    </div>
                  </div>
                </label>
                <label>Noise Seed</label>
                <input type="number" class="seed" id="noiseSeed" value="0">
                <button class="pri" id="genNoiseSeed">Generate Random Seed</button>
              </div>
            </div>
          </div>

          <div class="group">
            <p class="group-title">Model Composition</p>
            <div class="section">
              <div class="field">
                <label>Model Types</label>
                <input type="number" id="regionCount" min="1" value="2">
              </div>
              <div class="field">
                <label>Model</label>
                <select id="regionSelect"></select>
              </div>
              <div class="field">
                <label>Frequency of Model Type</label>
                <input type="number" id="frequncy" value="10" min="0" max="100">
              </div>
            </div>
          </div>

          <div class="group">
            <p class="group-title">Kinetics</p>
            <div class="section">
              <div class="field">
                <label>Model Type</label>
                <select id="model">
                  <option value="langmuir">1 to 1: First-order, Langmuir</option>
                  <option value="hetLigand">1 to 2: Independent Receptors</option>
                  <option value="twostate">2 state: Conformational Change</option>
                  <option value="bivAnalyte">2 state: Bivalent analyte</option>
                </select>
                <p class="hint" id="modelHint"></p>
              </div>
            </div>

            <div class="section">
              <p class="label">Kinetic constants</p>

              <!-- 1:1 / mass transport rates -->
              <div data-group="simple">
                <div class="grid2">
                  <div class="field">
                    <label>k<sub>a</sub> <span class="unit">M⁻¹s⁻¹</span></label>
                    <input type="number" id="ka" value="1e6" step="any">
                  </div>
                  <div class="field">
                    <label>k<sub>d</sub> <span class="unit">s⁻¹</span></label>
                    <input type="number" id="kd" value="1e-3" step="any">
                  </div>
                </div>
              </div>

              <!-- two-state rates -->
              <div data-group="twostate" style="display:none">
                <div class="grid2">
                  <div class="field">
                    <label>k<sub>a1</sub> <span class="unit">M⁻¹s⁻¹</span></label>
                    <input type="number" id="ka1" value="1e6" step="any">
                  </div>
                  <div class="field">
                    <label>k<sub>d1</sub> <span class="unit">s⁻¹</span></label>
                    <input type="number" id="kd1" value="1e-2" step="any">
                  </div>
                  <div class="field">
                    <label>k<sub>a2</sub> <span class="unit">s⁻¹</span></label>
                    <input type="number" id="ka2" value="5e-3" step="any">
                  </div>
                  <div class="field">
                    <label>k<sub>d2</sub> <span class="unit">s⁻¹</span></label>
                    <input type="number" id="kd2" value="1e-3" step="any">
                  </div>
                </div>
              </div>

              <!-- bivalent analyte rates -->
              <div data-group="bivAnalyte" style="display:none">
                <div class="grid2">
                  <div class="field">
                    <label>k<sub>a1</sub> <span class="unit">M⁻¹s⁻¹</span></label>
                    <input type="number" id="bivka1" value="1e6" step="any">
                  </div>
                  <div class="field">
                    <label>k<sub>d1</sub> <span class="unit">s⁻¹</span></label>
                    <input type="number" id="bivkd1" value="1e-2" step="any">
                  </div>
                  <div class="field">
                    <label>k<sub>a2</sub> <span class="unit">RU⁻¹s⁻¹</span></label>
                    <input type="number" id="bivka2" value="5e-3" step="any">
                  </div>
                  <div class="field">
                    <label>k<sub>d2</sub> <span class="unit">s⁻¹</span></label>
                    <input type="number" id="bivkd2" value="1e-3" step="any">
                  </div>
                </div>
              </div>

              <!-- hetLigand -->
              <div data-group="hetLigand" style="display:none">
                <div class="grid2">
                  <div class="field">
                    <label>k<sub>a1</sub> <span class="unit">M⁻¹s⁻¹</span></label>
                    <input type="number" id="hetka1" value="1e6" step="any">
                  </div>
                  <div class="field">
                    <label>k<sub>d1</sub> <span class="unit">s⁻¹</span></label>
                    <input type="number" id="hetkd1" value="1e-2" step="any">
                  </div>
                  <div class="field">
                    <label>k<sub>a2</sub> <span class="unit">M⁻¹s⁻¹</span></label>
                    <input type="number" id="hetka2" value="1e5" step="any">
                  </div>
                  <div class="field">
                    <label>k<sub>d2</sub> <span class="unit">s⁻¹</span></label>
                    <input type="number" id="hetkd2" value="1e-3" step="any">
                  </div>
                </div>
                <div class="field">
                  <label>R<sub>max2</sub> (max response) <span class="unit">RU</span></label>
                <input type="number" id="Rmax2" value="1" step="any">
              </div>
              </div>

              <!-- mass-transport limitation: a modifier that applies to ANY model -->
              <div class="check">
                <input type="checkbox" id="mtlOn">
                <label for="mtlOn">Mass-transport limitation</label>
              </div>
              <div class="field" id="ktField" style="display:none">
                <label>k<sub>tr</sub> (transport coeff.) <span class="unit">RU·M⁻¹s⁻¹</span></label>
                <input type="number" id="kt" value="1e8" step="any">
              </div>

              <div class="field">
                <label>R<sub>max</sub> (max response) <span class="unit">RU</span></label>
                <input type="number" id="Rmax" value="1" step="any">
              </div>
            </div>
          </div>

          <div class="group">
            <p class="group-title">Timings</p>
            <div class="section">
              <p class="label">Analyte concentrations</p>
              <div class="field">
                <label>Series <span class="unit">nM, comma/space separated</span></label>
                <textarea id="concSeries">6.25, 12, 25, 50, 100, 200</textarea>
              </div>
              <div class="grid3">
                <div class="field">
                  <label>Top <span class="unit">nM</span></label>
                  <input type="number" id="dilTop" value="200" step="any">
                </div>
                <div class="field">
                  <label>Dilution factor</label>
                  <input type="number" id="dilFactor" value="2" step="any">
                </div>
                <div class="field">
                  <label># points</label>
                  <input type="number" id="dilN" value="6" min="1" step="1">
                </div>
              </div>
              <button class="pri" id="genDil">Generate dilution series</button>
            </div>

            <div class="section">
              <p class="label">Injection timing</p>
              <div class="grid3">
                <div class="field">
                  <label>baseline <span class="unit">s</span></label>
                  <input type="number" id="tBase" value="30" step="any">
                </div>
                <div class="field">
                  <label>assoc. <span class="unit">s</span></label>
                  <input type="number" id="tAssoc" value="120" step="any">
                </div>
                <div class="field">
                  <label>dissoc. <span class="unit">s</span></label>
                  <input type="number" id="tDissoc" value="300" step="any">
                </div>
              </div>
            </div>
          </div>


        </main>
        <aside class="sidebar">
            <h1>SPR Stack Preview</h1>
              <div class="label">Frame preview</div>
              <div class="row">
                <button class="pri" id="play">Play</button>
                <input type="range" id="frame-slider" min="0" max="0" value="0" step="1">
                <span class="val" id="frame-val">0</span>
                <div id="total-frames"></div>
              </div>
            <div id="results">
                <div class="card">
                  <div id="conc-tag"></div>
                  <canvas id="img-canvas" width="480" height="640"></canvas>
                  <div class="img-label">480×640</div>
                </div>
                <div class="card">
                    <div class="label">Export</div>
                      <div class="btn-row">
                        <button class="pri" id="downloadAll"> Download all files </button>
                        <div id="status" class="status"></div>
                      </div>
                      <h1></h1>
                      <button class="pri" id="exportInfo">Export Model Information</button>
                    </div>
                </div>
            </div>
        </aside>
      </div>
    </body>
</html>
